services:
  - type: web
    name: smart-chatbot-api
    env: python
    region: oregon
    buildCommand: pip install --user -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
